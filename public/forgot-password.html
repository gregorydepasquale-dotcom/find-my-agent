<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Reset your password — Agentr</title>
<link rel="icon" href="/img/favicon.png" />
<link rel="stylesheet" href="/style.css" />
<style>
  .error-banner {
    background: rgba(180,81,50,0.25);
    border: 1px solid rgba(180,81,50,0.6);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14px;
    display: none;
  }
  .success-banner {
    background: rgba(52,150,90,0.2);
    border: 1px solid rgba(52,150,90,0.6);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14px;
    display: none;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="screen onboarding">
      <div class="brand"><img src="/img/ikonick-logo.png" alt="IKONICK" /><span class="brand-text">Agen<span class="accent">tr</span></span></div>
      <h1>Reset your<br/>password.</h1>
      <p class="sub">Enter your email and we'll send you a reset link.</p>
      <div class="error-banner" id="error-banner"></div>
      <div class="success-banner" id="success-banner"></div>
      <form id="fp-form" style="display:flex; flex-direction:column; gap:14px;">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required />
        </div>
        <button class="btn btn-primary" type="submit">Send reset link →</button>
      </form>
      <p class="hint"><a href="/" id="back-link" style="color:rgba(255,255,255,0.6);">← Back</a></p>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role') === 'realtor' ? 'realtor' : 'client';
      document.getElementById('back-link').href = role === 'realtor' ? '/realtor-login.html' : '/';

      document.getElementById('fp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = e.target.querySelector('button');
        const errorBanner = document.getElementById('error-banner');
        const successBanner = document.getElementById('success-banner');
        errorBanner.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Sending…';
        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: fd.get('email'), role }),
          });
          if (!res.ok) throw new Error('Something went wrong. Try again.');
          successBanner.textContent = "If that email is registered, we've sent a reset link — check your inbox.";
          successBanner.style.display = 'block';
          e.target.querySelector('input[name=email]').disabled = true;
          btn.remove();
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Send reset link →';
          errorBanner.textContent = err.message;
          errorBanner.style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
