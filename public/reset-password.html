<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Set a new password — Agentr</title>
<link rel="icon" href="/img/favicon.png" />
<link rel="stylesheet" href="/style.css" />
<style>
  .error-banner {
    background: rgba(180,81,50,0.25);
    border: 1px solid rgba(180,81,50,0.6);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14px;
    display: none;
  }
  .success-banner {
    background: rgba(52,150,90,0.2);
    border: 1px solid rgba(52,150,90,0.6);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14px;
    display: none;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="screen onboarding">
      <div class="brand"><img src="/img/ikonick-logo.png" alt="IKONICK" /><span class="brand-text">Agen<span class="accent">tr</span></span></div>
      <h1>Set a new<br/>password.</h1>
      <p class="sub" id="sub-text">Choose a new password for your account.</p>
      <div class="error-banner" id="error-banner"></div>
      <div class="success-banner" id="success-banner"></div>
      <form id="rp-form" style="display:flex; flex-direction:column; gap:14px;">
        <div class="field">
          <label>New password</label>
          <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <button class="btn btn-primary" type="submit">Set new password →</button>
      </form>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      const role = params.get('role') === 'realtor' ? 'realtor' : 'client';
      const loginUrl = role === 'realtor' ? '/realtor-login.html' : '/';

      if (!token) {
        document.getElementById('sub-text').textContent = 'This reset link is missing its token.';
        document.getElementById('rp-form').style.display = 'none';
      }

      document.getElementById('rp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = e.target.querySelector('button');
        const errorBanner = document.getElementById('error-banner');
        const successBanner = document.getElementById('success-banner');
        errorBanner.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Saving…';
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, role, password: fd.get('password') }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Something went wrong.');
          successBanner.textContent = 'Your password has been reset. Redirecting to log in…';
          successBanner.style.display = 'block';
          e.target.style.display = 'none';
          setTimeout(() => { window.location.href = loginUrl; }, 1800);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Set new password →';
          errorBanner.textContent = err.message;
          errorBanner.style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
