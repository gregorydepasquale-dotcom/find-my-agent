<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Agent login — Agentr</title>
<link rel="icon" href="/img/favicon.png" />
<link rel="stylesheet" href="/style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
<style>
  .error-banner {
    background: rgba(180,81,50,0.25);
    border: 1px solid rgba(180,81,50,0.6);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14px;
    display: none;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="screen onboarding">
      <div class="brand"><span class="brand-text">Agen<span class="accent">tr</span></span></div>
      <h1>Agent<br/>login.</h1>
      <p class="sub">Log in to see your leads and manage your profile.</p>

      <div id="oauth-container"></div>
      <div class="divider"><span>or</span></div>

      <div class="error-banner" id="error-banner"></div>

      <form id="login-form" style="display:flex; flex-direction:column; gap:14px;">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" placeholder="jane@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required />
        </div>
        <button class="btn btn-primary" type="submit">Log in →</button>
        <p class="hint" style="margin:-6px 0 0;"><a href="#" id="forgot-link" style="color:#fff;">Forgot password?</a></p>
      </form>
      <p class="hint">New here? <a href="/agent-signup.html" style="color:#fff;">List your profile — $49/mo</a></p>
      <p class="hint"><a href="/" style="color:rgba(255,255,255,0.6);">← Back to client view</a></p>
    </div>
  </div>
  <script>
    (function () {
      function waitForGlobal(check, tries, interval) {
        return new Promise((resolve) => {
          (function attempt(n) {
            if (check()) return resolve(true);
            if (n <= 0) return resolve(false);
            setTimeout(() => attempt(n - 1), interval || 250);
          })(tries == null ? 16 : tries);
        });
      }

      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get('next') || null;
      const errorBanner = document.getElementById('error-banner');
      function showError(msg) { errorBanner.textContent = msg; errorBanner.style.display = 'block'; }

      function goToDashboard(realtor) {
        window.location.href = nextUrl || ('/realtor/' + realtor.id);
      }

      async function setupOAuthButtons() {
        let cfg;
        try { cfg = await fetch('/api/auth/config').then((r) => r.json()); }
        catch (e) { return; }
        if (!cfg.googleClientId && !cfg.appleServicesId) return;
        const row = document.createElement('div');
        row.className = 'oauth-row';
        document.getElementById('oauth-container').appendChild(row);

        async function onToken(provider, idToken) {
          errorBanner.style.display = 'none';
          try {
            const res = await fetch('/api/auth/realtor/oauth-login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ provider, idToken }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Sign-in failed');
            goToDashboard(data.realtor);
          } catch (err) {
            showError(err.message);
          }
        }

        if (cfg.googleClientId && await waitForGlobal(() => window.google && window.google.accounts && window.google.accounts.id)) {
          const slot = document.createElement('div');
          slot.className = 'oauth-btn-slot';
          row.appendChild(slot);
          window.google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: (r) => onToken('google', r.credential) });
          window.google.accounts.id.renderButton(slot, { theme: 'filled_black', size: 'large', shape: 'pill', width: 260 });
        }
        if (cfg.appleServicesId && await waitForGlobal(() => window.AppleID && window.AppleID.auth)) {
          window.AppleID.auth.init({
            clientId: cfg.appleServicesId, scope: 'name email',
            redirectURI: cfg.appleRedirectUri || window.location.origin, usePopup: true,
          });
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn btn-apple';
          btn.textContent = ' Continue with Apple';
          row.appendChild(btn);
          btn.addEventListener('click', async () => {
            try {
              const data = await window.AppleID.auth.signIn();
              onToken('apple', data.authorization.id_token);
            } catch (e) {
              if (e && e.error !== 'popup_closed_by_user') alert('Apple sign-in failed. Please try again.');
            }
          });
        }
      }
      setupOAuthButtons();

      document.getElementById('forgot-link').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = '/forgot-password.html?role=realtor';
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        errorBanner.style.display = 'none';
        try {
          const res = await fetch('/api/auth/realtor/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Login failed');
          goToDashboard(data.realtor);
        } catch (err) {
          btn.disabled = false;
          showError(err.message);
        }
      });
    })();
  </script>
</body>
</html>
