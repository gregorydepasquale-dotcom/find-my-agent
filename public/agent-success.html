<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>You're all set — Agentr</title>
<link rel="icon" href="/img/favicon.png" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <div class="screen onboarding" style="text-align:center; align-items:center;">
      <div style="font-size:56px;">🎉</div>
      <h1>You're all set!</h1>
      <p class="sub">Your payment went through. Your profile will appear in the Agentr swipe deck within a minute or two, as soon as we confirm your subscription.</p>
      <a id="dash-link" href="/" class="btn btn-primary" style="text-decoration:none; display:inline-block;">View my dashboard</a>
      <p class="hint"><a href="/" style="color:rgba(255,255,255,0.6);">← Back to client view</a></p>
    </div>
  </div>
  <script>
    (function () {
      // This page is only ever reached after a real Stripe checkout completes in a browser, so
      // the native app should never land here — but as a safety net (Apple's guideline 3.1.1
      // flags any in-app reference to a non-IAP subscription, even a post-payment confirmation
      // screen), redirect straight back to the client experience if it somehow is opened there.
      try {
        if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()) {
          window.location.replace('/');
          return;
        }
      } catch (e) { /* ignore */ }

      const params = new URLSearchParams(window.location.search);
      const realtorId = params.get('realtor_id');
      if (realtorId) {
        document.getElementById('dash-link').href = '/realtor/' + realtorId;
      }
    })();
  </script>
</body>
</html>
