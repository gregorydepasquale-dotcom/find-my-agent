<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Admin — Agentr</title>
<link rel="icon" href="/img/favicon.png" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { overscroll-behavior: auto; }
  #admin-app { max-width: 720px; margin: 0 auto; min-height: 100vh; padding: 24px 20px 60px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .admin-header h1 { font-size: 22px; margin: 0; }
  .admin-header .brand { font-size: 17px; font-weight: 800; }
  .admin-header .brand .accent { color: var(--gold); }
  .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.8); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .login-wrap { max-width: 360px; margin: 18vh auto; padding: 0 20px; text-align: center; }
  .login-wrap h1 { font-size: 24px; margin-bottom: 6px; }
  .login-wrap p { color: rgba(255,255,255,0.65); font-size: 14px; margin-bottom: 20px; }
  .error-banner { background: rgba(180,81,50,0.25); border: 1px solid rgba(180,81,50,0.6); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin-top: 14px; display: none; text-align: left; }
  .realtor-card { background: rgba(255,255,255,0.07); border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
  .realtor-card summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  .realtor-card summary::-webkit-details-marker { display: none; }
  .rc-title { display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 700; }
  .rc-title .emoji { font-size: 22px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .rc-title .emoji img { width: 100%; height: 100%; object-fit: cover; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em; }
  .status-pill.active { background: rgba(233,194,28,0.18); color: var(--gold); }
  .status-pill.inactive { background: rgba(180,81,50,0.25); color: #e8927a; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edit-form { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .edit-form .field label { font-size: 12px; }
  .row-actions { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .row-actions .btn { flex: 1; padding: 11px 14px; font-size: 13.5px; }
  .btn-danger { background: rgba(180,81,50,0.85); color: white; }
  .add-toggle { width: 100%; margin-bottom: 18px; }
  .save-msg { font-size: 12.5px; color: var(--gold); margin-top: 4px; display: none; }
  .photo-row { display: flex; align-items: center; gap: 14px; }
  .photo-preview { width: 64px; height: 64px; border-radius: 14px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; flex-shrink: 0; }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .photo-controls input[type=file] { font-size: 12.5px; color: rgba(255,255,255,0.7); }
  .remove-photo-btn { align-self: flex-start; background: none; border: none; color: rgba(255,255,255,0.55); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .video-row { display: flex; align-items: center; gap: 14px; }
  .video-preview { width: 120px; height: 80px; border-radius: 10px; background: #000; object-fit: cover; flex-shrink: 0; }
  .video-preview-empty { width: 120px; height: 80px; border-radius: 10px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(255,255,255,0.4); flex-shrink: 0; text-align: center; }
  .remove-video-btn { align-self: flex-start; background: none; border: none; color: rgba(255,255,255,0.55); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .upload-progress { font-size: 12px; color: rgba(255,255,255,0.5); }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .admin-tabs button { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .admin-tabs button.active { background: var(--gold); border-color: var(--gold); color: #201436; }
  .client-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .client-toolbar p { margin: 0; font-size: 13px; color: rgba(255,255,255,0.6); }
  .client-table-wrap { overflow-x: auto; background: rgba(255,255,255,0.07); border-radius: 16px; }
  table.client-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.client-table th { text-align: left; padding: 12px 14px; color: rgba(255,255,255,0.55); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid rgba(255,255,255,0.1); white-space: nowrap; }
  table.client-table td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: top; }
  table.client-table tr:last-child td { border-bottom: none; }
  table.client-table td.muted { color: rgba(255,255,255,0.4); }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 8px; }
  .stat-card { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 18px 20px; }
  .stat-card .stat-value { font-size: 32px; font-weight: 800; color: var(--gold); line-height: 1.1; }
  .stat-card .stat-label { font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 6px; }
  .stat-card .stat-sub { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-top: 3px; }
  .state-check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px 10px; max-height: 170px; overflow-y: auto; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.12); }
  .state-check { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: rgba(255,255,255,0.8); cursor: pointer; }
  .state-check input { width: 15px; height: 15px; accent-color: var(--gold); flex-shrink: 0; cursor: pointer; }
  .state-check.checked { color: white; font-weight: 700; }
  .match-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(96,165,250,0.18); color: #7db8ff; white-space: nowrap; }
  .leaderboard { background: rgba(255,255,255,0.07); border-radius: 16px; padding: 6px 18px; margin-top: 18px; }
  .leaderboard h2 { font-size: 14px; margin: 14px 0 4px; color: rgba(255,255,255,0.8); }
  .leaderboard-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-rank { font-size: 12.5px; font-weight: 800; color: rgba(255,255,255,0.4); width: 18px; flex-shrink: 0; }
  .leaderboard-name { flex: 1; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leaderboard-empty { padding: 14px 0; font-size: 13px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <div id="admin-app"></div>

  <script>
  (function () {
    const root = document.getElementById('admin-app');
    const PW_KEY = 'agentrAdminPassword';

    const US_STATES = [
      ['AL', 'Alabama'], ['AK', 'Alaska'], ['AZ', 'Arizona'], ['AR', 'Arkansas'], ['CA', 'California'],
      ['CO', 'Colorado'], ['CT', 'Connecticut'], ['DE', 'Delaware'], ['DC', 'District of Columbia'],
      ['FL', 'Florida'], ['GA', 'Georgia'], ['HI', 'Hawaii'], ['ID', 'Idaho'], ['IL', 'Illinois'],
      ['IN', 'Indiana'], ['IA', 'Iowa'], ['KS', 'Kansas'], ['KY', 'Kentucky'], ['LA', 'Louisiana'],
      ['ME', 'Maine'], ['MD', 'Maryland'], ['MA', 'Massachusetts'], ['MI', 'Michigan'], ['MN', 'Minnesota'],
      ['MS', 'Mississippi'], ['MO', 'Missouri'], ['MT', 'Montana'], ['NE', 'Nebraska'], ['NV', 'Nevada'],
      ['NH', 'New Hampshire'], ['NJ', 'New Jersey'], ['NM', 'New Mexico'], ['NY', 'New York'],
      ['NC', 'North Carolina'], ['ND', 'North Dakota'], ['OH', 'Ohio'], ['OK', 'Oklahoma'], ['OR', 'Oregon'],
      ['PA', 'Pennsylvania'], ['RI', 'Rhode Island'], ['SC', 'South Carolina'], ['SD', 'South Dakota'],
      ['TN', 'Tennessee'], ['TX', 'Texas'], ['UT', 'Utah'], ['VT', 'Vermont'], ['VA', 'Virginia'],
      ['WA', 'Washington'], ['WV', 'West Virginia'], ['WI', 'Wisconsin'], ['WY', 'Wyoming'],
    ];
    // `selected` is the raw comma-separated code list stored on realtors.state (e.g. "TN,GA").
    // No boxes checked == unscoped (visible to clients in every state), same meaning the old
    // "All states (unscoped)" select option had.
    function stateChecksHtml(selected) {
      const selectedSet = new Set((selected || '').split(',').map((s) => s.trim().toUpperCase()).filter(Boolean));
      return US_STATES.map(([code, name]) => `
        <label class="state-check${selectedSet.has(code) ? ' checked' : ''}" title="${name}">
          <input type="checkbox" name="state" value="${code}" ${selectedSet.has(code) ? 'checked' : ''} /> ${code}
        </label>
      `).join('');
    }

    function el(html) {
      const t = document.createElement('template');
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    }
    function esc(s) {
      return (s == null ? '' : s).toString().replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }
    async function adminApi(path, opts) {
      const pw = sessionStorage.getItem(PW_KEY) || '';
      const res = await fetch('/api/admin' + path, {
        method: (opts && opts.method) || 'GET',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pw },
        body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (res.status === 401) { sessionStorage.removeItem(PW_KEY); renderLogin('Session expired — log in again.'); throw new Error('unauthorized'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    // Video uploads go straight through as the raw file body (not JSON/base64) — large clips
    // would otherwise blow past reasonable JSON payload sizes and pay a ~33% base64 penalty.
    async function adminUploadVideo(path, file) {
      const pw = sessionStorage.getItem(PW_KEY) || '';
      const res = await fetch('/api/admin' + path, {
        method: 'POST',
        headers: { 'Content-Type': file.type, 'X-Admin-Password': pw },
        body: file,
      });
      if (res.status === 401) { sessionStorage.removeItem(PW_KEY); renderLogin('Session expired — log in again.'); throw new Error('unauthorized'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function renderLogin(errorMsg) {
      root.innerHTML = '';
      root.appendChild(el(`
        <div class="login-wrap">
          <div class="brand" style="justify-content:center; display:flex; margin-bottom:14px;">Agen<span class="accent">tr</span> Admin</div>
          <h1>Enter admin password</h1>
          <p>Manage realtor profiles shown in the app.</p>
          <form id="login-form" style="display:flex; flex-direction:column; gap:12px;">
            <div class="field">
              <input type="password" name="password" placeholder="Admin password" required autofocus />
            </div>
            <button class="btn btn-primary" type="submit">Log in</button>
          </form>
          <div class="error-banner" id="login-error"></div>
        </div>
      `));
      const errBox = document.getElementById('login-error');
      if (errorMsg) { errBox.textContent = errorMsg; errBox.style.display = 'block'; }
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = new FormData(e.target).get('password');
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = 'Checking…';
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Login failed');
          sessionStorage.setItem(PW_KEY, pw);
          renderPanel();
        } catch (err) {
          btn.disabled = false; btn.textContent = 'Log in';
          errBox.textContent = err.message; errBox.style.display = 'block';
        }
      });
    }

    function emptyForm() {
      return { name: '', brokerage: '', photoEmoji: '🏠', photoUrl: null, videoUrl: null, bio: '', specialties: '', areas: '', yearsExperience: '', closedSales: '', rating: '', phone: '', email: '', subscriptionStatus: 'active', state: '' };
    }

    // Reads a File as base64 + its MIME type, for JSON-embedded photo uploads (keeps the
    // zero-dependency server from needing a multipart/form-data parser).
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const comma = dataUrl.indexOf(',');
          resolve({ base64: dataUrl.slice(comma + 1), contentType: file.type });
        };
        reader.onerror = () => reject(new Error('Could not read that file'));
        reader.readAsDataURL(file);
      });
    }

    function photoRowHtml(r) {
      const preview = r.photoUrl
        ? `<img src="${esc(r.photoUrl)}" alt="" />`
        : esc(r.photoEmoji || '🏠');
      return `
        <div class="field">
          <label>Profile photo</label>
          <div class="photo-row">
            <div class="photo-preview">${preview}</div>
            <div class="photo-controls">
              <input type="file" name="photoFile" accept="image/png,image/jpeg,image/webp" />
              ${r.photoUrl ? '<button type="button" class="remove-photo-btn">Remove photo</button>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    function videoRowHtml(r) {
      const preview = r.videoUrl
        ? `<video class="video-preview" src="${esc(r.videoUrl)}" muted playsinline controls></video>`
        : `<div class="video-preview-empty">No video</div>`;
      return `
        <div class="field">
          <label>Intro video (MP4, MOV, or WEBM — max 60MB)</label>
          <div class="video-row">
            <div class="video-preview-wrap">${preview}</div>
            <div class="photo-controls">
              <input type="file" name="videoFile" accept="video/mp4,video/quicktime,video/webm" />
              <span class="upload-progress" style="display:none;">Uploading…</span>
              ${r.videoUrl ? '<button type="button" class="remove-video-btn">Remove video</button>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    function fieldsHtml(r, idPrefix) {
      return `
        ${photoRowHtml(r)}
        ${videoRowHtml(r)}
        <div class="grid-2">
          <div class="field"><label>Name</label><input name="name" value="${esc(r.name)}" required /></div>
          <div class="field"><label>Fallback emoji</label><input name="photoEmoji" value="${esc(r.photoEmoji)}" maxlength="4" /></div>
        </div>
        <div class="field"><label>Brokerage</label><input name="brokerage" value="${esc(r.brokerage)}" /></div>
        <div class="grid-2">
          <div class="field"><label>Phone</label><input name="phone" value="${esc(r.phone)}" /></div>
          <div class="field"><label>Email</label><input name="email" value="${esc(r.email)}" /></div>
        </div>
        <div class="field">
          <label>States served (none checked = unscoped, visible to clients everywhere)</label>
          <div class="state-check-grid" data-state-checks>${stateChecksHtml(r.state)}</div>
        </div>
        <div class="field"><label>Specialties (comma-separated)</label><input name="specialties" value="${esc(r.specialties)}" /></div>
        <div class="field"><label>Cities / zip codes served (comma-separated)</label><input name="areas" value="${esc(r.areas)}" placeholder="e.g. Austin, Round Rock, 78701" /></div>
        <div class="field"><label>Bio</label><textarea name="bio" style="padding:14px 16px;border-radius:14px;border:none;background:rgba(255,255,255,0.12);color:white;font-family:inherit;min-height:70px;">${esc(r.bio)}</textarea></div>
        <div class="grid-2">
          <div class="field"><label>Years experience</label><input name="yearsExperience" type="number" value="${esc(r.yearsExperience)}" /></div>
          <div class="field"><label>Closed sales</label><input name="closedSales" type="number" value="${esc(r.closedSales)}" /></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Rating (0–5)</label><input name="rating" type="number" step="0.1" min="0" max="5" value="${esc(r.rating)}" /></div>
          <div class="field"><label>Listing status</label>
            <select name="subscriptionStatus">
              <option value="active" ${r.subscriptionStatus !== 'inactive' ? 'selected' : ''}>Active (visible in app)</option>
              <option value="inactive" ${r.subscriptionStatus === 'inactive' ? 'selected' : ''}>Inactive (hidden)</option>
            </select>
          </div>
        </div>
      `;
    }

    function formValues(form) {
      const fd = new FormData(form);
      return {
        name: fd.get('name'), brokerage: fd.get('brokerage'), photoEmoji: fd.get('photoEmoji'),
        bio: fd.get('bio'), specialties: fd.get('specialties'), areas: fd.get('areas'),
        yearsExperience: fd.get('yearsExperience'), closedSales: fd.get('closedSales'),
        rating: fd.get('rating'), phone: fd.get('phone'), email: fd.get('email'),
        subscriptionStatus: fd.get('subscriptionStatus'), state: fd.getAll('state'),
      };
    }

    // Toggles the `.checked` label styling on a state checkbox grid as boxes are (un)checked.
    // Delegated to the grid container so it works for both the add-form and every realtor
    // card's edit-form without needing a listener per checkbox.
    function wireStateChecks(container) {
      const grid = container.querySelector('[data-state-checks]');
      if (!grid) return;
      grid.addEventListener('change', (e) => {
        if (e.target.name !== 'state') return;
        e.target.closest('.state-check').classList.toggle('checked', e.target.checked);
      });
    }

    async function renderPanel() {
      root.innerHTML = '';
      root.appendChild(el(`
        <div>
          <div class="admin-header">
            <div class="brand">Agen<span class="accent">tr</span> Admin</div>
            <button class="logout-btn" id="logout-btn">Log out</button>
          </div>
          <div class="admin-tabs">
            <button id="tab-stats" class="active">Overview</button>
            <button id="tab-realtors">Realtors</button>
            <button id="tab-clients">Client Signups</button>
          </div>
          <div id="stats-view">
            <div id="stats-content">Loading…</div>
          </div>
          <div id="realtors-view" style="display:none;">
            <button class="btn btn-secondary add-toggle" id="add-toggle-btn">+ Add new realtor</button>
            <div id="add-form-wrap"></div>
            <div id="realtor-list">Loading…</div>
          </div>
          <div id="clients-view" style="display:none;">
            <div id="clients-content">Loading…</div>
          </div>
        </div>
      `));
      document.getElementById('logout-btn').addEventListener('click', () => {
        sessionStorage.removeItem(PW_KEY);
        renderLogin();
      });
      function showTab(name) {
        document.getElementById('tab-stats').classList.toggle('active', name === 'stats');
        document.getElementById('tab-realtors').classList.toggle('active', name === 'realtors');
        document.getElementById('tab-clients').classList.toggle('active', name === 'clients');
        document.getElementById('stats-view').style.display = name === 'stats' ? '' : 'none';
        document.getElementById('realtors-view').style.display = name === 'realtors' ? '' : 'none';
        document.getElementById('clients-view').style.display = name === 'clients' ? '' : 'none';
      }
      document.getElementById('tab-stats').addEventListener('click', () => {
        showTab('stats');
        loadStats();
      });
      document.getElementById('tab-realtors').addEventListener('click', () => {
        showTab('realtors');
      });
      document.getElementById('tab-clients').addEventListener('click', () => {
        showTab('clients');
        loadClients();
      });
      document.getElementById('add-toggle-btn').addEventListener('click', () => {
        const wrap = document.getElementById('add-form-wrap');
        if (wrap.children.length) { wrap.innerHTML = ''; return; }
        wrap.appendChild(el(`
          <div class="realtor-card">
            <form id="add-form" class="edit-form">
              ${fieldsHtml(emptyForm())}
              <div class="row-actions">
                <button class="btn btn-primary" type="submit">Create profile</button>
              </div>
              <div class="error-banner" style="display:none;"></div>
            </form>
          </div>
        `));
        wireStateChecks(wrap);
        document.getElementById('add-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const err = e.target.querySelector('.error-banner');
          const btn = e.target.querySelector('button[type=submit]');
          err.style.display = 'none';
          const photoFile = e.target.querySelector('input[name=photoFile]').files[0];
          const videoFile = e.target.querySelector('input[name=videoFile]').files[0];
          try {
            btn.disabled = true; btn.textContent = 'Creating…';
            const { realtor } = await adminApi('/realtors', { method: 'POST', body: formValues(e.target) });
            if (photoFile) {
              btn.textContent = 'Uploading photo…';
              const { base64, contentType } = await fileToBase64(photoFile);
              await adminApi('/realtors/' + realtor.id + '/photo', { method: 'POST', body: { imageBase64: base64, contentType } });
            }
            if (videoFile) {
              btn.textContent = 'Uploading video…';
              await adminUploadVideo('/realtors/' + realtor.id + '/video', videoFile);
            }
            wrap.innerHTML = '';
            loadList();
          } catch (ex) {
            btn.disabled = false; btn.textContent = 'Create profile';
            err.textContent = ex.message; err.style.display = 'block';
          }
        });
      });
      loadStats();
      loadList();
    }

    async function loadStats() {
      const contentEl = document.getElementById('stats-content');
      try {
        const [{ stats }, { realtors }] = await Promise.all([adminApi('/stats'), adminApi('/realtors')]);
        contentEl.innerHTML = '';
        contentEl.appendChild(el(`
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${stats.totalRealtors}</div>
              <div class="stat-label">Total agents</div>
              <div class="stat-sub">${stats.activeRealtors} active / ${stats.totalRealtors - stats.activeRealtors} inactive</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.totalClients}</div>
              <div class="stat-label">Total users</div>
              <div class="stat-sub">Everyone who completed signup</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.matchedClients}</div>
              <div class="stat-label">Users with a match</div>
              <div class="stat-sub">Liked at least one agent</div>
            </div>
          </div>
        `));

        // Which agents are actually getting picked, ranked by match count. Ties broken by
        // name so the order is stable across reloads rather than shuffling on equal counts.
        const ranked = [...realtors].sort((a, b) => b.matchCount - a.matchCount || a.name.localeCompare(b.name));
        const top = ranked.slice(0, 8);
        const rowsHtml = top.length
          ? top.map((r, i) => `
              <div class="leaderboard-row">
                <span class="leaderboard-rank">#${i + 1}</span>
                <span class="emoji" style="font-size:18px; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; overflow:hidden; flex-shrink:0;">${r.photoUrl ? `<img src="${esc(r.photoUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;" />` : esc(r.photoEmoji || '🏠')}</span>
                <span class="leaderboard-name">${esc(r.name)}</span>
                <span class="match-badge">🎯 ${r.matchCount} match${r.matchCount === 1 ? '' : 'es'}</span>
              </div>
            `).join('')
          : `<div class="leaderboard-empty">No agents have been matched with yet.</div>`;
        contentEl.appendChild(el(`
          <div class="leaderboard">
            <h2>Top agents by matches</h2>
            ${rowsHtml}
          </div>
        `));
      } catch (ex) {
        contentEl.innerHTML = '<p class="hint">Couldn\'t load stats: ' + esc(ex.message) + '</p>';
      }
    }

    async function loadList() {
      const listEl = document.getElementById('realtor-list');
      try {
        const { realtors } = await adminApi('/realtors');
        if (!realtors.length) {
          listEl.innerHTML = '<p class="hint">No realtor profiles yet.</p>';
          return;
        }
        listEl.innerHTML = '';
        realtors.forEach((r) => {
          const card = el(`
            <details class="realtor-card">
              <summary>
                <div class="rc-title"><span class="emoji">${r.photoUrl ? `<img src="${esc(r.photoUrl)}" alt="" />` : esc(r.photoEmoji || '🏠')}</span> ${esc(r.name)}</div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="match-badge" title="Clients who swiped right on this agent">🎯 ${r.matchCount} match${r.matchCount === 1 ? '' : 'es'}</span>
                  <span class="status-pill ${r.subscriptionStatus === 'inactive' ? 'inactive' : 'active'}">${r.subscriptionStatus === 'inactive' ? 'Inactive' : 'Active'}</span>
                </div>
              </summary>
              <form class="edit-form">
                ${fieldsHtml(r)}
                <div class="row-actions">
                  <button class="btn btn-primary" type="submit">Save changes</button>
                  <button type="button" class="btn btn-danger delete-btn">Delete profile</button>
                </div>
                <div class="save-msg">Saved.</div>
                <div class="error-banner" style="display:none;"></div>
              </form>
            </details>
          `);
          wireStateChecks(card);
          const form = card.querySelector('form');
          const errBox = card.querySelector('.error-banner');
          const saveMsg = card.querySelector('.save-msg');
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errBox.style.display = 'none'; saveMsg.style.display = 'none';
            try {
              await adminApi('/realtors/' + r.id, { method: 'PUT', body: formValues(form) });
              saveMsg.style.display = 'block';
              loadList();
            } catch (ex) {
              errBox.textContent = ex.message; errBox.style.display = 'block';
            }
          });
          card.querySelector('.delete-btn').addEventListener('click', async () => {
            if (!confirm('Delete ' + r.name + '? This cannot be undone.')) return;
            try {
              await adminApi('/realtors/' + r.id, { method: 'DELETE' });
              loadList();
            } catch (ex) {
              errBox.textContent = ex.message; errBox.style.display = 'block';
            }
          });
          const photoInput = card.querySelector('input[name=photoFile]');
          photoInput.addEventListener('change', async () => {
            const file = photoInput.files[0];
            if (!file) return;
            errBox.style.display = 'none'; saveMsg.style.display = 'none';
            const preview = card.querySelector('.photo-preview');
            const prevContent = preview.innerHTML;
            preview.textContent = '…';
            try {
              const { base64, contentType } = await fileToBase64(file);
              await adminApi('/realtors/' + r.id + '/photo', { method: 'POST', body: { imageBase64: base64, contentType } });
              loadList();
            } catch (ex) {
              preview.innerHTML = prevContent;
              errBox.textContent = ex.message; errBox.style.display = 'block';
            }
          });
          const removeBtn = card.querySelector('.remove-photo-btn');
          if (removeBtn) {
            removeBtn.addEventListener('click', async () => {
              try {
                await adminApi('/realtors/' + r.id + '/photo', { method: 'DELETE' });
                loadList();
              } catch (ex) {
                errBox.textContent = ex.message; errBox.style.display = 'block';
              }
            });
          }
          const videoInput = card.querySelector('input[name=videoFile]');
          const uploadProgress = card.querySelector('.upload-progress');
          videoInput.addEventListener('change', async () => {
            const file = videoInput.files[0];
            if (!file) return;
            errBox.style.display = 'none'; saveMsg.style.display = 'none';
            uploadProgress.style.display = 'inline';
            try {
              await adminUploadVideo('/realtors/' + r.id + '/video', file);
              loadList();
            } catch (ex) {
              uploadProgress.style.display = 'none';
              errBox.textContent = ex.message; errBox.style.display = 'block';
            }
          });
          const removeVideoBtn = card.querySelector('.remove-video-btn');
          if (removeVideoBtn) {
            removeVideoBtn.addEventListener('click', async () => {
              try {
                await adminApi('/realtors/' + r.id + '/video', { method: 'DELETE' });
                loadList();
              } catch (ex) {
                errBox.textContent = ex.message; errBox.style.display = 'block';
              }
            });
          }
          listEl.appendChild(card);
        });
      } catch (ex) {
        if (ex.message !== 'unauthorized') {
          listEl.innerHTML = '<p class="hint">' + esc(ex.message) + '</p>';
        }
      }
    }

    const INTENT_LABELS = { buy: 'Buy', sell: 'Sell', invest: 'Invest / STR', rent: 'Rent' };

    function clientsToCsv(clients) {
      const header = ['Name', 'Phone', 'Email', 'Looking to', 'City', 'State', 'Signed up'];
      const rows = clients.map((c) => [
        c.name || '', c.phone || '', c.email || '',
        INTENT_LABELS[c.intent] || c.intent || '', c.areaInterest || '', c.state || '', c.createdAt || '',
      ]);
      const escCsv = (v) => {
        const s = String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      return [header, ...rows].map((r) => r.map(escCsv).join(',')).join('\n');
    }

    async function loadClients() {
      const contentEl = document.getElementById('clients-content');
      try {
        const { clients } = await adminApi('/clients');
        if (!clients.length) {
          contentEl.innerHTML = '<p class="hint">No client signups yet.</p>';
          return;
        }
        contentEl.innerHTML = '';
        const toolbar = el(`
          <div class="client-toolbar">
            <p>${clients.length} signup${clients.length === 1 ? '' : 's'} total</p>
            <button class="btn btn-secondary" id="export-csv-btn" style="padding:8px 16px; font-size:12.5px;">Download CSV</button>
          </div>
        `);
        toolbar.querySelector('#export-csv-btn').addEventListener('click', () => {
          const csv = clientsToCsv(clients);
          const blob = new Blob([csv], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'agentr-client-signups-' + new Date().toISOString().slice(0, 10) + '.csv';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        });
        contentEl.appendChild(toolbar);

        const tableWrap = el('<div class="client-table-wrap"></div>');
        const table = el(`
          <table class="client-table">
            <thead>
              <tr><th>Name</th><th>Phone</th><th>Email</th><th>Looking to</th><th>City</th><th>State</th><th>Signed up</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        `);
        const tbody = table.querySelector('tbody');
        clients.forEach((c) => {
          const row = el(`
            <tr>
              <td>${esc(c.name)}</td>
              <td class="${c.phone ? '' : 'muted'}">${esc(c.phone) || '—'}</td>
              <td class="${c.email ? '' : 'muted'}">${esc(c.email) || '—'}</td>
              <td>${esc(INTENT_LABELS[c.intent] || c.intent) || '—'}</td>
              <td class="${c.areaInterest ? '' : 'muted'}">${esc(c.areaInterest) || '—'}</td>
              <td class="${c.state ? '' : 'muted'}">${esc(c.state) || '—'}</td>
              <td class="muted">${esc(c.createdAt)}</td>
              <td><button class="remove-photo-btn delete-client-btn" type="button">Delete</button></td>
            </tr>
          `);
          row.querySelector('.delete-client-btn').addEventListener('click', async () => {
            if (!confirm('Delete ' + (c.name || 'this signup') + '? This cannot be undone.')) return;
            try {
              await adminApi('/clients/' + c.id, { method: 'DELETE' });
              loadClients();
              loadStats();
            } catch (ex) {
              alert(ex.message);
            }
          });
          tbody.appendChild(row);
        });
        tableWrap.appendChild(table);
        contentEl.appendChild(tableWrap);
      } catch (ex) {
        if (ex.message !== 'unauthorized') {
          contentEl.innerHTML = '<p class="hint">' + esc(ex.message) + '</p>';
        }
      }
    }

    if (sessionStorage.getItem(PW_KEY)) {
      renderPanel();
    } else {
      renderLogin();
    }
  })();
  </script>
</body>
</html>
